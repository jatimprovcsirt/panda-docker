# TEMPLATE ONLY. Not listed in kustomization.yaml, and must not be applied.
#
# A plain Secret sits unencrypted in etcd by default. For a Vault Secret ID
# that means a credential readable by anyone with API access to the cluster.
# Deliver these with External Secrets Operator or SealedSecrets instead.
apiVersion: v1
kind: Secret
metadata:
  name: panda-docker-secrets
  namespace: panda
type: Opaque
stringData:
  PANDA_VAULT_URL: "https://vault.internal:8200"
  PANDA_VAULT_ROLE_ID: ""
  PANDA_VAULT_SECRET_ID: ""
  PANDA_INDEX_KEY: ""

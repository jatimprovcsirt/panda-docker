apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: panda-docker
  namespace: panda
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: panda-docker
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              panda.jatimprov.go.id/client: "true"
        - podSelector:
            matchLabels:
              panda.jatimprov.go.id/client: "true"
      ports:
        - protocol: TCP
          port: 8080
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: vault
      ports:
        - protocol: TCP
          port: 8200
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53

name: Probe the fallback publish path

# TEMPORARY DIAGNOSTIC — delete once the questions below are answered.
#
# Harbor sits behind Cloudflare, and a custom rule there rejects connections
# from outside Indonesia. A GitHub-hosted runner is refused with 403 before
# Harbor sees the request. Mutual TLS is the remedy.
#
# Settled so far:
#   - curl with the certificate reaches Harbor            (401, not 403)
#   - docker login and docker pull work from the daemon   (cert in certs.d)
#   - BuildKit does NOT present the certificate, so
#     `buildx build --push` dies at the Cloudflare edge   (HTML in the log)
#
# BuildKit is what build-push-action pushes with, so the all-in-one step is
# out. What remains is whether the fallback holds: build per architecture
# into the daemon, push each from the daemon, then assemble a manifest list.
# The manifest commands talk to the registry from the CLI rather than the
# daemon, so whether they honour certs.d is a separate question again.
#
# Also deletes the previous run's leftover repository, which its own cleanup
# step failed to remove because it called the API without a certificate.
#
# Answers are published as commit statuses; job logs need repository admin.

on:
  push:
    paths:
      - ".github/workflows/probe-registry.yml"
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

env:
  HARBOR: harbor.jatimprov.go.id
  SCRATCH: panda/probe-delete-me

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Materialise the client certificate
        env:
          CLIENT_CERT: ${{ secrets.CLOUDFLARE_CLIENT_CERT }}
          CLIENT_KEY: ${{ secrets.CLOUDFLARE_CLIENT_KEY }}
        run: |
          set -uo pipefail
          mkdir -p /tmp/cf
          printf '%s\n' "$CLIENT_CERT" | tr -d '\r' > /tmp/cf/client.crt
          printf '%s\n' "$CLIENT_KEY"  | tr -d '\r' > /tmp/cf/client.key
          chmod 600 /tmp/cf/client.key

          sudo mkdir -p "/etc/docker/certs.d/${HARBOR}"
          sudo cp /tmp/cf/client.crt "/etc/docker/certs.d/${HARBOR}/client.cert"
          sudo cp /tmp/cf/client.key "/etc/docker/certs.d/${HARBOR}/client.key"
          sudo chmod 600 "/etc/docker/certs.d/${HARBOR}/client.key"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in
        env:
          HARBOR_USERNAME: ${{ secrets.HARBOR_USERNAME }}
          HARBOR_PASSWORD: ${{ secrets.HARBOR_PASSWORD }}
        run: |
          set -uo pipefail
          echo "$HARBOR_PASSWORD" | docker login "$HARBOR" -u "$HARBOR_USERNAME" --password-stdin

      - name: Build per architecture and push from the daemon
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          mkdir -p /tmp/scratch
          printf 'FROM scratch\nCOPY probe.txt /probe.txt\n' > /tmp/scratch/Dockerfile
          echo probe > /tmp/scratch/probe.txt

          report() {
            echo "[$1] $2 :: $3"
            curl -s -o /dev/null -X POST \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
              -d "$(node -e 'process.stdout.write(JSON.stringify({state:"success",context:process.argv[1],description:(process.argv[2]+" "+process.argv[3]).slice(0,140)}))' "$1" "$2" "$3")"
          }

          # --- push from the daemon, per architecture ---------------------
          pushdetail=""
          pushresult="PUSH-OK"
          for arch in amd64 arm64; do
            docker buildx build --platform "linux/${arch}" \
              -t "${HARBOR}/${SCRATCH}:${arch}" --load /tmp/scratch >/dev/null 2>&1
            if ! docker push "${HARBOR}/${SCRATCH}:${arch}" >/tmp/cf/push-${arch}.log 2>&1; then
              pushresult="push-failed(${arch})"
              pushdetail=$(tail -3 /tmp/cf/push-${arch}.log | tr '\n' ' ' | tr -s ' ')
            fi
          done
          report "daemon-push" "$pushresult" "${pushdetail:0:80}"

          # --- manifest list, built by the CLI, not the daemon -------------
          mandetail=""
          manresult="MANIFEST-OK"
          if [ "$pushresult" = "PUSH-OK" ]; then
            docker manifest create "${HARBOR}/${SCRATCH}:multi" \
              "${HARBOR}/${SCRATCH}:amd64" "${HARBOR}/${SCRATCH}:arm64" >/tmp/cf/man.log 2>&1
            if ! docker manifest push "${HARBOR}/${SCRATCH}:multi" >>/tmp/cf/man.log 2>&1; then
              manresult="manifest-failed"
              mandetail=$(tail -3 /tmp/cf/man.log | tr '\n' ' ' | tr -s ' ')
            fi
          else
            manresult="skipped"
          fi
          report "manifest-list" "$manresult" "${mandetail:0:80}"

      - name: Remove the throwaway repository
        env:
          GH_TOKEN: ${{ github.token }}
          HARBOR_USERNAME: ${{ secrets.HARBOR_USERNAME }}
          HARBOR_PASSWORD: ${{ secrets.HARBOR_PASSWORD }}
        run: |
          set -uo pipefail
          # With the certificate this time: without it the request is refused
          # at the edge and the repository is never actually removed.
          code=$(curl -s -o /dev/null -w '%{http_code}' -X DELETE \
            --cert /tmp/cf/client.crt --key /tmp/cf/client.key \
            -u "${HARBOR_USERNAME}:${HARBOR_PASSWORD}" \
            "https://${HARBOR}/api/v2.0/projects/panda/repositories/${SCRATCH#panda/}")
          echo "cleanup status: $code"

          curl -s -o /dev/null -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d "$(node -e 'process.stdout.write(JSON.stringify({state:"success",context:"cleanup",description:("delete http "+process.argv[1]).slice(0,140)}))' "$code")"

name: Probe the fallback publish path

# TEMPORARY DIAGNOSTIC — delete once the questions below are answered.
#
# Harbor sits behind Cloudflare, and a custom rule there rejects connections
# from outside Indonesia. A GitHub-hosted runner is refused with 403 before
# Harbor sees the request. Mutual TLS is the remedy.
#
# Settled so far:
#   - curl with the certificate reaches Harbor            (401, not 403)
#   - docker login and docker pull work from the daemon   (cert in certs.d)
#   - BuildKit does NOT present the certificate, so
#     `buildx build --push` dies at the Cloudflare edge   (HTML in the log)
#
# BuildKit is what build-push-action pushes with, so the all-in-one step is
# out. What remains is whether the fallback holds: build per architecture
# into the daemon, push each from the daemon, then assemble a manifest list.
# The manifest commands talk to the registry from the CLI rather than the
# daemon, so whether they honour certs.d is a separate question again.
#
# Two design notes, both learned the hard way:
#
#   1. GitHub runs `run:` with `bash -e`, so one failing command aborts the
#      step before it can report anything. Every command that may fail is
#      guarded here, and the step disables -e outright.
#   2. Results are committed to the repository rather than published as
#      commit statuses. Reading statuses costs API calls, the unauthenticated
#      limit is 60 an hour, and a polling loop exhausts it — which is how the
#      previous run's result was lost.

on:
  push:
    paths:
      - ".github/workflows/probe-registry.yml"
  workflow_dispatch:

permissions:
  contents: write

env:
  HARBOR: harbor.jatimprov.go.id
  SCRATCH: panda/probe-delete-me

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Certificate, login, build, push, manifest
        env:
          HARBOR_USERNAME: ${{ secrets.HARBOR_USERNAME }}
          HARBOR_PASSWORD: ${{ secrets.HARBOR_PASSWORD }}
          CLIENT_CERT: ${{ secrets.CLOUDFLARE_CLIENT_CERT }}
          CLIENT_KEY: ${{ secrets.CLOUDFLARE_CLIENT_KEY }}
        run: |
          set +e
          : > /tmp/report.txt
          say() { echo "$*" | tee -a /tmp/report.txt; }

          mkdir -p /tmp/cf

          printf '%s\n' "$CLIENT_CERT" | tr -d '\r' > /tmp/cf/client.crt
          printf '%s\n' "$CLIENT_KEY"  | tr -d '\r' > /tmp/cf/client.key
          chmod 600 /tmp/cf/client.key
          sudo mkdir -p "/etc/docker/certs.d/${HARBOR}"
          sudo cp /tmp/cf/client.crt "/etc/docker/certs.d/${HARBOR}/client.cert"
          sudo cp /tmp/cf/client.key "/etc/docker/certs.d/${HARBOR}/client.key"
          # Ownership matters here, and getting it wrong produced a failure
          # that read like a certificate problem. The daemon runs as root and
          # reads the key regardless, which is why login and push are
          # unaffected. `docker manifest` talks to the registry from the CLI
          # process instead, so a root-owned mode-600 key gives it EACCES.
          sudo chown "$(id -u):$(id -g)" "/etc/docker/certs.d/${HARBOR}/client.key"
          sudo chmod 600 "/etc/docker/certs.d/${HARBOR}/client.key"

          say "cert bytes=$(wc -c < /tmp/cf/client.crt) key bytes=$(wc -c < /tmp/cf/client.key) installed=[$(ls /etc/docker/certs.d/${HARBOR} 2>/dev/null | tr '\n' ' ')]"

          echo "$HARBOR_PASSWORD" | docker login "$HARBOR" -u "$HARBOR_USERNAME" --password-stdin \
            > /tmp/cf/login.log 2>&1
          say "login exit=$? :: $(tail -1 /tmp/cf/login.log)"

          docker buildx create --name probe --driver docker-container --use >/dev/null 2>&1
          docker buildx inspect --bootstrap >/dev/null 2>&1

          mkdir -p /tmp/scratch
          printf 'FROM scratch\nCOPY probe.txt /probe.txt\n' > /tmp/scratch/Dockerfile
          echo probe > /tmp/scratch/probe.txt

          # --- build per architecture, push from the daemon ---------------
          for arch in amd64 arm64; do
            docker buildx build --platform "linux/${arch}" \
              -t "${HARBOR}/${SCRATCH}:${arch}" --load /tmp/scratch \
              > "/tmp/cf/build-${arch}.log" 2>&1
            b=$?
            docker push "${HARBOR}/${SCRATCH}:${arch}" > "/tmp/cf/push-${arch}.log" 2>&1
            p=$?
            say "arch=${arch} build=${b} push=${p} :: $(tail -2 /tmp/cf/push-${arch}.log | tr '\n' ' ' | tr -s ' ' | head -c 110)"
          done

          # --- manifest list, assembled by the CLI not the daemon ---------
          docker manifest create "${HARBOR}/${SCRATCH}:multi" \
            "${HARBOR}/${SCRATCH}:amd64" "${HARBOR}/${SCRATCH}:arm64" \
            > /tmp/cf/man.log 2>&1
          mc=$?
          docker manifest push "${HARBOR}/${SCRATCH}:multi" >> /tmp/cf/man.log 2>&1
          mp=$?
          say "manifest create=${mc} push=${mp} :: $(tail -2 /tmp/cf/man.log | tr '\n' ' ' | tr -s ' ' | head -c 110)"

          # --- tidy up, with the certificate this time --------------------
          code=$(curl -s -o /tmp/cf/del.out -w '%{http_code}' -X DELETE \
            --cert /tmp/cf/client.crt --key /tmp/cf/client.key \
            -u "${HARBOR_USERNAME}:${HARBOR_PASSWORD}" \
            "https://${HARBOR}/api/v2.0/projects/panda/repositories/${SCRATCH#panda/}")
          say "cleanup http=${code} :: $(head -c 90 /tmp/cf/del.out | tr '\n' ' ')"

          exit 0

      - name: Publish the report into the repository
        if: always()
        run: |
          set +e
          [ -f /tmp/report.txt ] || echo "(no report produced)" > /tmp/report.txt
          cp /tmp/report.txt probe-result.txt

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f probe-result.txt
          git commit -q -m "Probe result [skip ci]" && git push -q origin HEAD:main
          echo "published"

name: Probe registry reachability and BuildKit push

# TEMPORARY DIAGNOSTIC — delete once the question below is answered.
#
# Harbor sits behind Cloudflare, and a custom rule there rejects connections
# from outside Indonesia. A GitHub-hosted runner (Azure, US) is refused with
# 403 before Harbor sees the request — verified with no credentials, so it
# was never an auth problem.
#
# Mutual TLS is the remedy, and two things are now settled: curl reaches
# Harbor with the certificate, and the Docker daemon does too (login and
# pull both succeed once the certificate is in /etc/docker/certs.d/).
#
# What is NOT settled: build-push-action pushes from BuildKit, which runs in
# its own container, and that container cannot see the host's certs.d. A
# successful login followed by a failed push is the confusing failure this
# would produce. So: copy the certificate in and try an actual push.
#
# The push target is a throwaway repository, deleted in the same run.
#
# Answers are published as commit statuses; job logs need repository admin.
#
# Path-filtered to itself so it does not run on unrelated pushes.

on:
  push:
    paths:
      - ".github/workflows/probe-registry.yml"
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

env:
  HARBOR: harbor.jatimprov.go.id
  SCRATCH_REPO: panda/probe-delete-me

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Materialise the client certificate
        env:
          CLIENT_CERT: ${{ secrets.CLOUDFLARE_CLIENT_CERT }}
          CLIENT_KEY: ${{ secrets.CLOUDFLARE_CLIENT_KEY }}
        run: |
          set -uo pipefail
          mkdir -p /tmp/cf

          if [ -z "${CLIENT_CERT:-}" ] || [ -z "${CLIENT_KEY:-}" ]; then
            echo "one or both secrets are empty"
            exit 0
          fi

          # CRLF would make OpenSSL reject the PEM with a parse error that
          # reads like a wrong certificate rather than a stray carriage return.
          printf '%s\n' "$CLIENT_CERT" | tr -d '\r' > /tmp/cf/client.crt
          printf '%s\n' "$CLIENT_KEY"  | tr -d '\r' > /tmp/cf/client.key
          chmod 600 /tmp/cf/client.key
          echo "cert and key written"

      - name: Install the certificate where Docker looks for it
        run: |
          set -uo pipefail
          sudo mkdir -p "/etc/docker/certs.d/${HARBOR}"
          sudo cp /tmp/cf/client.crt "/etc/docker/certs.d/${HARBOR}/client.cert"
          sudo cp /tmp/cf/client.key "/etc/docker/certs.d/${HARBOR}/client.key"
          sudo chmod 600 "/etc/docker/certs.d/${HARBOR}/client.key"

      - name: Log in
        env:
          HARBOR_USERNAME: ${{ secrets.HARBOR_USERNAME }}
          HARBOR_PASSWORD: ${{ secrets.HARBOR_PASSWORD }}
        run: |
          set -uo pipefail
          echo "$HARBOR_PASSWORD" | docker login "$HARBOR" -u "$HARBOR_USERNAME" --password-stdin

      - name: Copy the certificate into BuildKit and push a throwaway image
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail

          docker buildx create --name probe --driver docker-container --use >/dev/null 2>&1
          docker buildx inspect --bootstrap >/dev/null 2>&1

          bk=$(docker ps --filter "name=buildx_buildkit_probe" --format '{{.Names}}' | head -1)
          if [ -z "$bk" ]; then
            result="no-buildkit-container"
          else
            # The question, stated directly: does BuildKit's resolver read
            # client certificates from its own /etc/docker/certs.d?
            docker exec "$bk" mkdir -p "/etc/docker/certs.d/${HARBOR}" 2>/dev/null
            docker cp /tmp/cf/client.crt "$bk:/etc/docker/certs.d/${HARBOR}/client.cert"
            docker cp /tmp/cf/client.key "$bk:/etc/docker/certs.d/${HARBOR}/client.key"

            mkdir -p /tmp/scratch
            printf 'FROM scratch\nCOPY probe.txt /probe.txt\n' > /tmp/scratch/Dockerfile
            echo probe > /tmp/scratch/probe.txt

            if docker buildx build \
                 --platform linux/amd64,linux/arm64 \
                 -t "${HARBOR}/${SCRATCH_REPO}:buildkit" \
                 --push /tmp/scratch >/tmp/cf/bk.log 2>&1; then
              result="PUSH-OK"
            else
              result="push-failed"
            fi
          fi

          detail=$(tail -3 /tmp/cf/bk.log 2>/dev/null | tr '\n' ' ' | tr -s ' ' | head -c 80)
          echo "buildkit push: $result :: $detail"

          curl -s -o /dev/null -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d "$(node -e 'process.stdout.write(JSON.stringify({state:"success",context:"buildkit-push",description:(process.argv[1]+" "+process.argv[2]).slice(0,140)}))' "$result" "$detail")"

      - name: Remove the throwaway repository
        env:
          GH_TOKEN: ${{ github.token }}
          HARBOR_USERNAME: ${{ secrets.HARBOR_USERNAME }}
          HARBOR_PASSWORD: ${{ secrets.HARBOR_PASSWORD }}
        run: |
          set -uo pipefail

          code=$(curl -s -o /dev/null -w '%{http_code}' -X DELETE \
            -u "${HARBOR_USERNAME}:${HARBOR_PASSWORD}" \
            "https://${HARBOR}/api/v2.0/projects/panda/repositories/${SCRATCH_REPO#panda/}")
          echo "cleanup status: $code"

          curl -s -o /dev/null -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d "$(node -e 'process.stdout.write(JSON.stringify({state:"success",context:"cleanup",description:("delete "+process.argv[1]).slice(0,140)}))' "$code")"

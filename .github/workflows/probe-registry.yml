name: Probe registry reachability

# TEMPORARY DIAGNOSTIC — delete once the question below is answered.
#
# The release workflow's Harbor login failed with 403 Forbidden. From an
# Indonesian network the same registry returns 200 for good credentials and
# 401 for bad ones, so a 403 is not something Harbor's own auth logic
# produces. Harbor sits behind Cloudflare, which raises the possibility that
# the runner is refused before Harbor sees the request at all.
#
# This asks that question with no credentials involved. The answer is
# published as a commit status, because job logs need repository admin to
# read and the whole point is to find out what the runner sees.
#
# Path-filtered to itself so it does not run on unrelated pushes.

on:
  push:
    paths:
      - ".github/workflows/probe-registry.yml"
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Ask Harbor, anonymously, and publish what comes back
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail

          code=$(curl -s -o /dev/null -w '%{http_code}' \
            https://harbor.jatimprov.go.id/v2/)
          ip=$(curl -s --max-time 10 https://api.ipify.org || echo unknown)
          server=$(curl -s -D - -o /dev/null https://harbor.jatimprov.go.id/v2/ \
            | grep -i '^server:' | tr -d '\r' | head -1)

          desc="v2=${code} ip=${ip} ${server}"
          echo "$desc"

          curl -s -o /dev/null -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d "$(node -e 'process.stdout.write(JSON.stringify({state:"success",context:"harbor-probe",description:process.argv[1].slice(0,140)}))' "$desc")"

      - name: Also record what the token endpoint says
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' \
            "https://harbor.jatimprov.go.id/service/token?service=harbor-registry&scope=repository:panda/panda-docker:pull")
          echo "token endpoint: ${code}"

          curl -s -o /dev/null -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d "$(node -e 'process.stdout.write(JSON.stringify({state:"success",context:"harbor-probe-token",description:("token-endpoint="+process.argv[1]).slice(0,140)}))' "$code")"

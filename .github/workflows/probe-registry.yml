name: Probe registry reachability

# TEMPORARY DIAGNOSTIC — delete once the question below is answered.
#
# The release workflow's Harbor login failed with 403 Forbidden. From an
# Indonesian network the same registry returns 200 for good credentials and
# 401 for bad ones, so a 403 is not something Harbor's own auth logic
# produces. Harbor sits behind Cloudflare, which raises the possibility that
# the runner is being refused before Harbor sees the request at all.
#
# This asks one question, with no credentials involved: does an anonymous
# request from a GitHub-hosted runner get the 401 that Harbor would send, or
# a 403 from something in front of it?
#
# Path-filtered to itself so it does not run on unrelated pushes.

on:
  push:
    paths:
      - ".github/workflows/probe-registry.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Where the runner exits from
        run: |
          echo -n "egress IP: "
          curl -s https://api.ipify.org || echo "(lookup failed)"
          echo

      - name: Anonymous request to Harbor
        run: |
          echo "--- GET /v2/ (no credentials) ---"
          curl -s -o /dev/null -w "status: %{http_code}\n" \
            https://harbor.jatimprov.go.id/v2/

          echo
          echo "--- response headers ---"
          curl -s -D - -o /dev/null https://harbor.jatimprov.go.id/v2/ | head -25

      - name: Anonymous token request
        run: |
          echo "--- GET /service/token (no credentials) ---"
          curl -s -o /dev/null -w "status: %{http_code}\n" \
            "https://harbor.jatimprov.go.id/service/token?service=harbor-registry&scope=repository:panda/panda-docker:pull"

      - name: For comparison, a host that is definitely not blocked
        run: |
          echo -n "github.com/v2/ equivalent: "
          curl -s -o /dev/null -w "%{http_code}\n" https://api.github.com/

name: Release

# Triggered by a version tag. Publishing to Harbor is the step that makes an
# image available to OPDs, so everything before it verifies the artifact that
# is about to be published rather than the source it came from.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  REGISTRY: harbor.jatimprov.go.id
  IMAGE: harbor.jatimprov.go.id/panda/panda-docker

jobs:
  publish:
    runs-on: ubuntu-latest
    # Scoped to this job rather than the whole workflow, so the default token
    # stays read-only. `contents: write` is what the release step at the bottom
    # needs to create the GitHub Release — without it that step fails with
    # "Resource not accessible by integration" after the image is already in
    # Harbor, leaving a published image with no release record behind it.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true

      - run: go vet ./...
      - run: go test -race ./...

      - name: Tag matches the build arguments
        run: |
          echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          echo "COMMIT=${GITHUB_SHA::8}" >> "$GITHUB_ENV"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to Harbor
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      # Both architectures: OPD infrastructure in Jawa Timur is predominantly
      # x86_64, but arm64 costs little and covers ARM-based on-prem servers and
      # developer machines.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ env.VERSION }}
            COMMIT=${{ env.COMMIT }}
          tags: |
            ${{ env.IMAGE }}:${{ env.VERSION }}
            ${{ env.IMAGE }}:${{ env.COMMIT }}
          # Provenance and SBOM travel with the image, so a consumer can check
          # what produced it rather than trusting the tag.
          provenance: true
          sbom: true

      - name: Scan the published image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.IMAGE }}:${{ env.VERSION }}
          format: table
          exit-code: "1"
          severity: CRITICAL,HIGH
          # Only fail on findings that have a fix available. Failing on an
          # unfixable base-image CVE blocks every release until upstream moves,
          # and a permanently red gate is one people learn to bypass.
          ignore-unfixed: true

      # The offline path: sites with no route to Harbor load the image from a
      # tarball on removable media.
      #
      # One tarball per architecture, not one tarball. A `docker pull` with no
      # --platform resolves to the runner's own architecture — amd64 on GitHub
      # runners — so a single tarball would ship amd64 while the registry holds
      # both, and the site opening the tarball on an ARM box would get
      # `exec format error` with nothing in the filename to explain why. The
      # site that most needs an offline tarball is also the one most likely to
      # be running something other than x86_64.
      - name: Produce offline tarballs
        run: |
          set -euo pipefail
          for arch in amd64 arm64; do
            tar="panda-docker-${VERSION}-linux-${arch}.tar"

            docker pull --platform "linux/${arch}" "${IMAGE}:${VERSION}"
            docker save "${IMAGE}:${VERSION}" -o "${tar}"
            sha256sum "${tar}" > "${tar}.sha256"

            # Verify the tarball holds the architecture its filename claims,
            # rather than trusting that the flags above did what they say. A
            # mislabelled tarball is worse than a missing one: it fails at the
            # offline site, days later, with no route back to a registry to
            # diagnose it against.
            docker load -i "${tar}" > /dev/null 2>&1
            got="$(docker inspect --format '{{.Architecture}}' "${IMAGE}:${VERSION}")"
            if [ "${got}" != "${arch}" ]; then
              echo "FAIL: ${tar} holds ${got}, expected ${arch}"
              exit 1
            fi
            echo "ok: ${tar} (${arch})"
          done

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            panda-docker-*.tar
            panda-docker-*.tar.sha256

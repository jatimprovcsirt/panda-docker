# PANDA Docker — development.
#
# NOT FOR PRODUCTION. It serves plaintext HTTP with no authentication, which
# is only safe because it binds to loopback on a developer's machine. The
# container would refuse this configuration under PANDA_ENV=production.
name: panda-dev

services:
  panda-docker:
    image: ${PANDA_IMAGE:-panda-docker:local}
    build:
      context: ..
      args:
        VERSION: dev
        COMMIT: local
    restart: "no"

    ports:
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:8081:8081"

    environment:
      PANDA_ENV: dev
      PANDA_API_PROTOCOL: ${PANDA_API_PROTOCOL:-rest}
      PANDA_AUTH_MODE: none
      # Required for auth mode `none`. It exists so that turning authentication
      # off is a decision someone typed, not a default they inherited.
      PANDA_I_UNDERSTAND_THIS_IS_INSECURE: "true"
      PANDA_TLS_ENABLED: "false"

      PANDA_LOG_FORMAT: text
      PANDA_LOG_LEVEL: debug

      PANDA_KEY_PROVIDER_DRIVER: local
      PANDA_DEFAULT_KID: dev-key
      # Generated by `make dev-env`. Never a real key, and never committed.
      PANDA_KEY_dev-key: ${PANDA_KEY_DEV_KEY:?run make dev-env first}
      PANDA_INDEX_KEY: ${PANDA_INDEX_KEY:?run make dev-env first}
